<header class="barra" [class.con-sombra]="conSombra">
  <div class="contenedor barra-fila">
    <a class="marca" href="#inicio" (click)="ir($event, 'inicio')" aria-label="Francesca, fábrica de pastas. Ir al inicio">
      <img src="assets/logo-192.png" alt="" width="48" height="48" />
      <span class="marca-texto">
        <span class="marca-nombre">Francesca</span>
        <span class="marca-sub">Fábrica de pastas</span>
      </span>
    </a>

    <nav class="enlaces" aria-label="Secciones de la página">
      <a *ngFor="let e of enlaces" [href]="'#' + e.id" (click)="ir($event, e.id)">{{ e.texto }}</a>
    </nav>

    <a class="btn btn-accion boton-pedido" [href]="pedido.href" [attr.target]="pedido.esWhatsapp ? '_blank' : null" rel="noopener noreferrer">
      {{ pedido.etiquetaCorta }}
    </a>

    <button
      type="button"
      class="menu-boton"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="menu-movil"
    >
      <span class="visually-hidden">{{ menuAbierto ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <app-icono [nombre]="menuAbierto ? 'cerrar' : 'menu'"></app-icono>
    </button>
  </div>

  <nav id="menu-movil" class="menu-movil" [class.abierto]="menuAbierto" aria-label="Secciones de la página (menú)" [attr.inert]="menuAbierto ? null : ''">
    <a *ngFor="let e of enlaces" [href]="'#' + e.id" (click)="ir($event, e.id)">{{ e.texto }}</a>
    <a class="btn btn-accion btn-lg" [href]="pedido.href" [attr.target]="pedido.esWhatsapp ? '_blank' : null" rel="noopener noreferrer">
      {{ pedido.etiquetaCorta }}
    </a>
  </nav>
</header>

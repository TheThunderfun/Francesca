<section id="pedido" class="seccion cierre sobre-verde" aria-labelledby="cierre-titulo">
  <div class="contenedor cierre-contenido">
    <h2 id="cierre-titulo" class="cierre-titulo reveal">¿Qué pasta llevás hoy?</h2>
    <p class="cierre-bajada reveal" style="--i: 1">
      Escribinos o llamanos, contanos qué querés y pasá a buscarlo por el local.
    </p>
    <div class="cierre-acciones reveal" style="--i: 2">
      <a class="btn btn-accion btn-lg" [href]="pedido.href" [attr.target]="pedido.esWhatsapp ? '_blank' : null" rel="noopener noreferrer">
        <app-icono [nombre]="pedido.esWhatsapp ? 'whatsapp' : 'telefono'"></app-icono>
        {{ pedido.etiquetaLarga }}
      </a>
      <!-- Si el pedido ya es una llamada (sin WhatsApp cargado), no se repite el botón. -->
      @if (pedido.esWhatsapp) {
        <a class="btn btn-claro btn-lg" [href]="'tel:' + negocio.telefonoLink">
          <app-icono nombre="telefono"></app-icono> Llamar al {{ negocio.telefonoVisible }}
        </a>
      }
    </div>
    <p class="cierre-redes reveal" style="--i: 3">
      También en
      <a [href]="negocio.instagram" target="_blank" rel="noopener noreferrer">Instagram</a>
      y
      <a [href]="negocio.facebook" target="_blank" rel="noopener noreferrer">Facebook</a>.
    </p>
  </div>
</section>
